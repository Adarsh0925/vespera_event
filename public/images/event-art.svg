<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="patanArtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="50%" stop-color="#12182b" />
      <stop offset="100%" stop-color="#1e183a" />
    </linearGradient>
    <radialGradient id="courtyardLight" cx="50%" cy="32%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090d18" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="newariRoof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mandalaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="600" fill="url(#patanArtBg)" />
  <circle cx="400" cy="230" r="280" fill="url(#courtyardLight)" />

  <!-- Patan Durbar Square Traditional Newari Pagoda Rooflines -->
  <!-- Top Tier Roof with curved eaves (Gajur on top) -->
  <line x1="400" y1="50" x2="400" y2="75" stroke="#fbbf24" stroke-width="2.5" />
  <circle cx="400" cy="48" r="4" fill="#fbbf24" />
  <!-- Pagoda Roof Curve 1 -->
  <path d="M 330,105 Q 400,85 470,105 L 450,118 Q 400,102 350,118 Z" fill="url(#newariRoof)" stroke="#a855f7" stroke-width="1" />
  <!-- Pagoda Roof Tier 2 (Wider) -->
  <path d="M 270,150 Q 400,125 530,150 L 510,165 Q 400,142 290,165 Z" fill="url(#newariRoof)" stroke="#818cf8" stroke-width="1" />

  <!-- Courtyard Stone Columns & Brick Carved Architecture -->
  <g stroke="#334155" stroke-opacity="0.4" stroke-width="1.5">
    <!-- Left Column -->
    <rect x="180" y="165" width="22" height="300" fill="#0c1322" />
    <!-- Right Column -->
    <rect x="598" y="165" width="22" height="300" fill="#0c1322" />
    <!-- Traditional carved struts -->
    <line x1="202" y1="165" x2="270" y2="150" stroke="#64748b" />
    <line x1="598" y1="165" x2="530" y2="150" stroke="#64748b" />
  </g>

  <!-- Center Exhibition Wall & Framed Paubha Mandala -->
  <rect x="260" y="185" width="280" height="230" fill="#080c16" stroke="#475569" stroke-width="1.2" />

  <!-- Sacred Paubha Mandala Geometry inside frame -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#mandalaGrad)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 4" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <!-- 8 Lotus Petals Geometry -->
    <polygon points="0,-68 18,-35 48,-48 35,-18 68,0 35,18 48,48 18,35 0,68 -18,35 -48,48 -35,18 -68,0 -35,-18 -48,-48 -18,-35" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.8" />
    <circle cx="0" cy="0" r="6" fill="#f8fafc" />
  </g>

  <!-- Courtyard Exhibition Plinth for Bronze / Terracotta Sculpture -->
  <polygon points="320,440 480,440 510,470 290,470" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <rect x="290" y="470" width="220" height="70" fill="#0d1527" stroke="#334155" stroke-width="1" />

  <!-- Traditional Nepali Bronze Tara / Peacock Sculpture Silhouette on Plinth -->
  <g fill="#c084fc" opacity="0.85" stroke="#fbbf24" stroke-width="0.8">
    <ellipse cx="400" cy="425" rx="14" ry="16" />
    <path d="M 390,438 C 380,410 420,410 410,438 Z" />
    <!-- Halo (Prabhamandala) -->
    <circle cx="400" cy="425" r="22" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="2 3" />
  </g>

  <!-- Gallery Visitors Silhouette (Admiring Patan Exhibition) -->
  <g fill="#060913" opacity="0.85">
    <ellipse cx="660" cy="510" rx="14" ry="16" />
    <path d="M 642,530 C 642,522 678,522 678,530 L 672,590 L 648,590 Z" />
    <ellipse cx="710" cy="520" rx="12" ry="14" />
    <path d="M 696,536 C 696,528 724,528 724,536 L 720,595 L 700,595 Z" />
  </g>

  <!-- Directional Ceiling Spotlight -->
  <polygon points="400,0 400,0 520,440 280,440" fill="#f8fafc" opacity="0.04" />
</svg>

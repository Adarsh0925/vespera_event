<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ktmWorkshopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="deskLampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a1020" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="editorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Studio Canvas -->
  <rect width="800" height="600" fill="url(#ktmWorkshopBg)" />
  <circle cx="400" cy="260" r="300" fill="url(#deskLampGlow)" />

  <!-- Studio Workbench Perspective -->
  <polygon points="60,340 740,340 800,600 0,600" fill="#0c1424" stroke="#1e293b" stroke-width="1.5" />
  <line x1="60" y1="340" x2="740" y2="340" stroke="#334155" stroke-width="2" />

  <!-- Dual Modern Laptops on Workshop Table -->
  <!-- Left Screen: Modern Code Editor -->
  <g transform="translate(140, 310)">
    <!-- Base -->
    <polygon points="0,170 240,170 220,185 20,185" fill="#334155" />
    <!-- Screen Shell -->
    <rect x="20" y="20" width="200" height="150" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <!-- Screen Inner Display -->
    <rect x="26" y="26" width="188" height="138" fill="url(#editorGrad)" />
    <!-- Editor Header Bar -->
    <rect x="26" y="26" width="188" height="14" fill="#1e293b" />
    <circle cx="34" cy="33" r="2.5" fill="#ef4444" />
    <circle cx="42" cy="33" r="2.5" fill="#eab308" />
    <circle cx="50" cy="33" r="2.5" fill="#22c55e" />
    <!-- Code Lines -->
    <line x1="38" y1="52" x2="100" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="108" y1="52" x2="150" y2="52" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="64" x2="120" y2="64" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="76" x2="160" y2="76" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />
    <line x1="62" y1="88" x2="140" y2="88" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="100" x2="90" y2="100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    <line x1="38" y1="112" x2="70" y2="112" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Right Screen: Responsive Web UI Wireframe Layout -->
  <g transform="translate(420, 310)">
    <!-- Base -->
    <polygon points="0,170 240,170 220,185 20,185" fill="#334155" />
    <!-- Screen Shell -->
    <rect x="20" y="20" width="200" height="150" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <!-- Screen Inner Display -->
    <rect x="26" y="26" width="188" height="138" fill="#0f172a" />
    <!-- UI Header -->
    <rect x="36" y="36" width="168" height="16" fill="#1e293b" rx="2" />
    <circle cx="46" cy="44" r="3" fill="#6366f1" />
    <line x1="56" y1="44" x2="90" y2="44" stroke="#94a3b8" stroke-width="2" />
    <!-- Hero card wireframe -->
    <rect x="36" y="58" width="168" height="42" fill="#1e1b4b" rx="3" stroke="#6366f1" stroke-width="0.8" />
    <line x1="46" y1="72" x2="120" y2="72" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="46" y1="82" x2="150" y2="82" stroke="#64748b" stroke-width="1.5" />
    <!-- 2 Column cards wireframe -->
    <rect x="36" y="106" width="80" height="46" fill="#1e293b" rx="2" />
    <rect x="124" y="106" width="80" height="46" fill="#1e293b" rx="2" />
  </g>

  <!-- Collaborative Developers Silhouette in Kathmandu Tech Hub -->
  <g fill="#070a13" opacity="0.75">
    <circle cx="260" cy="245" r="26" />
    <path d="M 220,325 C 220,280 300,280 300,325 Z" />
    <circle cx="540" cy="235" r="28" />
    <path d="M 495,330 C 495,275 585,275 585,330 Z" />
    <line x1="500" y1="285" x2="435" y2="315" stroke="#070a13" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Studio Ceiling Pendant Lamp -->
  <line x1="400" y1="0" x2="400" y2="130" stroke="#475569" stroke-width="1.5" />
  <path d="M 360,150 L 440,150 L 450,165 L 350,165 Z" fill="#334155" />
  <ellipse cx="400" cy="165" rx="50" ry="8" fill="#e0e7ff" />
</svg>
